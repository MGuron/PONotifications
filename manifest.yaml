_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: PO Notifications
  description: Notify purchasers about product statuses
  background_color: "#132be8"

features:
  bot_user:
    display_name: PO Notifications
    always_online: false
  shortcuts:
  - name: PO Summary
    type: global
    callback_id: po_status_summary
    description: Upload a vendor CSV from FRCBom into the PO 

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands

settings:
  event_subscriptions:
    request_url: https://po-notifications.vercel.app/api/index
  interactivity:
    is_enabled: true
    request_url: https://po-notifications.vercel.app/api/index
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
